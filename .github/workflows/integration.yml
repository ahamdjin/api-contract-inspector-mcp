name: Real oasdiff and MCP client
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install upstream oasdiff CLI
        run: |
          go install github.com/oasdiff/oasdiff@v1.34.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install MCP package
        run: python -m pip install -e .
      - name: Run all unit and true-client tests
        run: |
          oasdiff --version
          python -m unittest discover -s tests -v
